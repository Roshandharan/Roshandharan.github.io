<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Roshan Dharan | Portfolio</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // GitHub Pages has no server-side rewrite, so it serves this file for any
    // path that isn't a real file (e.g. a client-side route like /projects on
    // refresh). We re-encode the path into a query string and redirect to
    // index.html, which decodes it back before the router mounts. Real 404s
    // (routes the app doesn't recognize) are rendered by the app's own
    // catch-all route once index.html loads.
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
